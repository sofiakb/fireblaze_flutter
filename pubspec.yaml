name: sofiakb_fireblaze_flutter
description: The packages allows to easily manage firebase requests.
maintainer: Sofiane Akbly
version: 2.2.0-dev.3

environment:
  sdk: ">3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Firebase / google dependencies
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1

  # other dependencies
  collection: ^1.18.0
  intl: ^0.20.2
  localstorage: ^6.0.0
  mime: ^2.0.0
  universal_io: ^2.2.2

scripts:
  release: ./scripts/release.sh
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.1
